<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Deep Oceanic & Earth Base Gradients -->
    <linearGradient id="oceanDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#07142E" />
      <stop offset="70%" stop-color="#092847" />
      <stop offset="100%" stop-color="#041224" />
    </linearGradient>

    <linearGradient id="coastalShallows" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#008392" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#0D9488" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#041E34" stop-opacity="0" />
    </linearGradient>

    <!-- Landmass & Topography Gradients (Monochromatic Slate Teal & Midnight Blue) -->
    <linearGradient id="landmassBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09182A" />
      <stop offset="40%" stop-color="#0F2840" />
      <stop offset="75%" stop-color="#0B3B48" />
      <stop offset="100%" stop-color="#051822" />
    </linearGradient>

    <linearGradient id="terrainRidge" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="50%" stop-color="#082032" />
      <stop offset="100%" stop-color="#0E3846" />
    </linearGradient>

    <!-- Glowing City Lights & Urban Grid Gradients -->
    <linearGradient id="cityGlowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cityGlowGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </linearGradient>

    <!-- Dark Vignette for Text Readability -->
    <radialGradient id="heroVignette" cx="45%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#040814" stop-opacity="0.82" />
      <stop offset="45%" stop-color="#040814" stop-opacity="0.68" />
      <stop offset="85%" stop-color="#040814" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0.75" />
    </radialGradient>

    <!-- Glowing Ambient Filters -->
    <filter id="glowPulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="deepBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" />
    </filter>
  </defs>

  <!-- ================= 1. OCEAN DEPTHS BASE ================= -->
  <rect width="1920" height="1080" fill="url(#oceanDeep)" />

  <!-- Bathymetric Ocean Trenches & Continental Shelf Contours -->
  <path d="M-50,200 Q400,350 900,180 T1950,280 L1950,1100 L-50,1100 Z" fill="#030C1C" opacity="0.8" />
  <path d="M100,0 Q600,450 1100,320 T1950,550 L1950,1100 L100,1100 Z" fill="#04142B" opacity="0.6" />

  <!-- ================= 2. COASTAL SHALLOWS & REEF SHELVES ================= -->
  <!-- Cyan Shimmering Coastal Waters -->
  <path d="M350,0 C650,280 820,400 1150,380 C1450,360 1680,500 1950,420 L1950,750 C1750,780 1500,680 1200,600 C850,520 600,620 300,500 C150,440 0,380 -50,350 Z" 
        fill="url(#coastalShallows)" />

  <!-- Outer Island Archipelagoes & Atolls -->
  <g fill="#00E5FF" opacity="0.5" filter="url(#glowPulse)">
    <circle cx="850" cy="480" r="14" />
    <circle cx="880" cy="495" r="8" />
    <circle cx="910" cy="510" r="11" />
    <circle cx="945" cy="520" r="6" />
    <circle cx="1420" cy="460" r="16" />
    <circle cx="1450" cy="475" r="9" />
    <circle cx="1510" cy="490" r="13" />
  </g>

  <!-- ================= 3. CONTINENTAL LANDMASS & TOPOGRAPHY ================= -->
  <!-- Main Coastal Landform -->
  <path d="M480,-50 C720,240 920,320 1220,330 C1480,340 1700,440 1950,360 L1950,1120 L380,1120 C320,950 280,820 340,680 C390,560 380,420 420,280 Z" 
        fill="url(#landmassBase)" />

  <!-- Mountain Ridges & Shaded Countryside Topography -->
  <path d="M700,1120 C750,850 820,720 980,580 C1140,440 1350,420 1620,480 C1780,520 1880,450 1950,410 L1950,1120 Z" 
        fill="url(#terrainRidge)" opacity="0.85" />

  <!-- High Elevation Plateau / Rugged Terrain Contours -->
  <g fill="none" stroke="#00E5FF" stroke-width="0.75" opacity="0.18">
    <path d="M600,450 Q850,520 1150,460 T1750,580" />
    <path d="M650,500 Q900,580 1200,510 T1800,630" />
    <path d="M720,560 Q960,630 1280,570 T1850,690" />
    <path d="M800,630 Q1050,700 1350,640 T1900,750" />
    <path d="M900,720 Q1150,780 1450,710 T1950,820" />
  </g>

  <!-- Agricultural & Rural Patchwork Fields (Country Areas) -->
  <g stroke="#0E424F" stroke-width="1.2" fill="#071E28" opacity="0.55">
    <rect x="750" y="700" width="45" height="35" rx="3" />
    <rect x="800" y="695" width="55" height="40" rx="3" />
    <rect x="760" y="740" width="50" height="45" rx="3" />
    <rect x="815" y="740" width="60" height="35" rx="3" />
    <rect x="880" y="710" width="65" height="50" rx="3" />
    <rect x="880" y="765" width="55" height="40" rx="3" />
    
    <rect x="1450" y="680" width="70" height="50" rx="3" />
    <rect x="1525" y="675" width="55" height="60" rx="3" />
    <rect x="1460" y="735" width="60" height="45" rx="3" />
    <rect x="1525" y="740" width="75" height="50" rx="3" />
    <rect x="1605" y="700" width="65" height="70" rx="3" />
  </g>

  <!-- ================= 4. URBAN METROPOLITAN NETWORKS & CITIES ================= -->
  
  <!-- Coastal Highway Arteries & Infrastructure Corridors -->
  <g fill="none" stroke="#00E5FF" stroke-width="1.8" opacity="0.45" filter="url(#glowPulse)">
    <!-- Primary Coastal Spine -->
    <path d="M500,0 C740,260 950,335 1250,345 C1500,355 1720,460 1950,380" />
    <!-- Secondary Inland Beltway -->
    <path d="M420,300 C600,480 850,560 1200,530 C1550,500 1780,680 1950,620" stroke="#38BDF8" stroke-width="1.4" />
    <!-- Grid Connectors -->
    <path d="M960,335 L850,560" />
    <path d="M1250,345 L1200,530" />
    <path d="M1650,420 L1580,650" />
  </g>

  <!-- Major Coastal Metro Complex #1 (Miami / Harbor Scale) -->
  <g transform="translate(1180, 310)">
    <!-- Dense Downtown Grid -->
    <g stroke="#00E5FF" stroke-width="1.2" opacity="0.75">
      <line x1="-70" y1="-30" x2="70" y2="-30" />
      <line x1="-80" y1="-15" x2="80" y2="-15" />
      <line x1="-90" y1="0" x2="90" y2="0" />
      <line x1="-80" y1="15" x2="80" y2="15" />
      <line x1="-70" y1="30" x2="70" y2="30" />
      <line x1="-50" y1="45" x2="50" y2="45" />

      <line x1="-60" y1="-40" x2="-60" y2="40" />
      <line x1="-40" y1="-50" x2="-40" y2="50" />
      <line x1="-20" y1="-55" x2="-20" y2="55" />
      <line x1="0" y1="-60" x2="0" y2="60" />
      <line x1="20" y1="-55" x2="20" y2="55" />
      <line x1="40" y1="-50" x2="40" y2="50" />
      <line x1="60" y1="-40" x2="60" y2="40" />
    </g>
    <!-- Glowing Skyscrapers / City Center Luminescence -->
    <circle cx="0" cy="0" r="60" fill="url(#cityGlowCyan)" />
    <circle cx="5" cy="-5" r="25" fill="#FFFFFF" opacity="0.8" filter="url(#glowPulse)" />
    <circle cx="-15" cy="10" r="8" fill="#FDE047" opacity="0.9" filter="url(#glowPulse)" />
  </g>

  <!-- Secondary Coastal Metro Complex #2 -->
  <g transform="translate(1620, 410)">
    <g stroke="#38BDF8" stroke-width="1" opacity="0.6">
      <line x1="-50" y1="-20" x2="50" y2="-20" />
      <line x1="-60" y1="0" x2="60" y2="0" />
      <line x1="-50" y1="20" x2="50" y2="20" />
      <line x1="-30" y1="-35" x2="-30" y2="35" />
      <line x1="0" y1="-40" x2="0" y2="40" />
      <line x1="30" y1="-35" x2="30" y2="35" />
    </g>
    <circle cx="0" cy="0" r="45" fill="url(#cityGlowCyan)" />
    <circle cx="0" cy="0" r="18" fill="#FFFFFF" opacity="0.75" filter="url(#glowPulse)" />
  </g>

  <!-- Inland Capital Metro #3 -->
  <g transform="translate(1380, 580)">
    <circle cx="0" cy="0" r="50" fill="url(#cityGlowCyan)" opacity="0.7" />
    <circle cx="0" cy="0" r="15" fill="#FDE047" opacity="0.85" filter="url(#glowPulse)" />
  </g>

  <!-- Thousands of Organic Micro-City / Town Light Clusters -->
  <g fill="#00E5FF" opacity="0.65" filter="url(#glowPulse)">
    <circle cx="680" cy="240" r="3.5" />
    <circle cx="720" cy="260" r="2.5" />
    <circle cx="760" cy="230" r="4" />
    <circle cx="840" cy="310" r="3" />
    <circle cx="910" cy="350" r="5" fill="#FDE047" />
    <circle cx="1020" cy="330" r="4.5" />
    <circle cx="1060" cy="380" r="3" />
    <circle cx="1110" cy="320" r="5.5" />
    <circle cx="1280" cy="360" r="4" />
    <circle cx="1320" cy="390" r="6" fill="#FDE047" />
    <circle cx="1480" cy="430" r="5" />
    <circle cx="1540" cy="450" r="3.5" />
    <circle cx="1720" cy="480" r="5.5" fill="#FDE047" />
    <circle cx="1780" cy="510" r="3" />
    <circle cx="1850" cy="490" r="4.5" />

    <circle cx="1020" cy="480" r="4" />
    <circle cx="1110" cy="520" r="3.5" />
    <circle cx="1160" cy="560" r="5" />
    <circle cx="1250" cy="620" r="4" fill="#FDE047" />
    <circle cx="1310" cy="540" r="5.5" />
    <circle cx="1450" cy="610" r="4.5" />
    <circle cx="1520" cy="640" r="3" />
    <circle cx="1680" cy="660" r="5" />
  </g>

  <!-- ================= 5. MOUR REAL-TIME SATELLITE DISPATCH TARGETS ================= -->
  <!-- Target Beacon 1: Miami Downtown Core -->
  <g transform="translate(1180, 310)" filter="url(#glowPulse)">
    <!-- Outer Ping Wave -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.8" />
    <circle cx="0" cy="0" r="38" fill="none" stroke="#00E5FF" stroke-width="2" opacity="0.9" />
    <!-- Center Target Crosshair -->
    <line x1="-18" y1="0" x2="18" y2="0" stroke="#00E5FF" stroke-width="2.5" />
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#00E5FF" stroke-width="2.5" />
    <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
    <!-- HUD Badge -->
    <rect x="24" y="-28" width="115" height="24" rx="6" fill="#061224" stroke="#00E5FF" stroke-width="1.2" />
    <text x="32" y="-12" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#00E5FF">📍 ACTIVE EYE: 4K</text>
  </g>

  <!-- Target Beacon 2: Coastline Beach Inspection -->
  <g transform="translate(920, 340)" filter="url(#glowPulse)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="6" fill="#10B981" />
    <rect x="16" y="-22" width="105" height="22" rx="5" fill="#061224" stroke="#10B981" stroke-width="1" />
    <text x="24" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#34D399">⚡ GIG DISPATCH</text>
  </g>

  <!-- Target Beacon 3: Port / Marina Real-Time Feed -->
  <g transform="translate(1620, 410)" filter="url(#glowPulse)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="5 5" />
    <circle cx="0" cy="0" r="6" fill="#FBBF24" />
    <rect x="18" y="-22" width="95" height="22" rx="5" fill="#061224" stroke="#FBBF24" stroke-width="1" />
    <text x="26" y="-8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#FDE047">📷 LIVE STREAM</text>
  </g>

  <!-- ================= 6. SUBTLE ATMOSPHERIC CLOUD WISPS ================= -->
  <g fill="#38BDF8" opacity="0.08" filter="url(#deepBlur)">
    <ellipse cx="400" cy="180" rx="350" ry="120" />
    <ellipse cx="1400" cy="260" rx="420" ry="150" />
    <ellipse cx="900" cy="780" rx="480" ry="160" />
  </g>

  <!-- ================= 7. GLOBAL AERIAL HUD TELEMETRY OVERLAY ================= -->
  <g stroke="#00E5FF" opacity="0.25" stroke-width="1">
    <!-- Top-Left Orbital Metadata -->
    <line x1="60" y1="60" x2="160" y2="60" />
    <line x1="60" y1="60" x2="60" y2="160" />
    <line x1="1860" y1="60" x2="1760" y2="60" />
    <line x1="1860" y1="60" x2="1860" y2="160" />
    
    <line x1="60" y1="1020" x2="160" y2="1020" />
    <line x1="60" y1="1020" x2="60" y2="920" />
    <line x1="1860" y1="1020" x2="1760" y2="1020" />
    <line x1="1860" y1="1020" x2="1860" y2="920" />
  </g>

  <g font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="11" font-weight="700" fill="#00E5FF" opacity="0.45" letter-spacing="1.5">
    <text x="80" y="85">ALTITUDE // 18,400M ORBITAL</text>
    <text x="80" y="105">COORD // 25.7617° N, 80.1918° W</text>
    <text x="1620" y="85">SENSOR // OPTICAL 4K MULTI-BAND</text>
    <text x="1685" y="105">NETWORK // MOUR GLOBAL</text>
  </g>

  <!-- ================= 8. MASTER HERO SHADING & TEXT READABILITY VIGNETTE ================= -->
  <!-- This gradient softly shades the center and left region so that your white text and teal button pop with extreme clarity -->
  <rect width="1920" height="1080" fill="url(#heroVignette)" />

</svg>